services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-5090}:8080"
    environment:
      # Brevo SMTP relay for the contact form; values come from .env next to this file
      # (server-only, never committed). Without them the form answers 503.
      Contact__SmtpUser: ${BREVO_SMTP_LOGIN:-}
      Contact__SmtpPassword: ${BREVO_SMTP_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
