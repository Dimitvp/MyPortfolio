# Host-level reverse proxy for dimitar-nikolov.net on the Hetzner svara-prod server.
#
# Same pattern as biblioteka.svara.bg: system nginx on the Docker host, one file per
# site, the `portfolio` container bound to 127.0.0.1:5090 only (see docker-compose.yml).
#
# Install: copy to /etc/nginx/sites-available/dimitar-nikolov.net.conf, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`.
#
# Once the A records for dimitar-nikolov.net and www point at 46.62.253.87:
#   certbot --nginx -d dimitar-nikolov.net -d www.dimitar-nikolov.net --redirect
# rewrites the `listen` directives below to add TLS (443) and the http->https redirect.
# After that the live file is certbot-owned: copy live -> git, never git -> live.

upstream portfolio_web { server 127.0.0.1:5090; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name dimitar-nikolov.net www.dimitar-nikolov.net;

    location / {
        proxy_pass         http://portfolio_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
    }
}
